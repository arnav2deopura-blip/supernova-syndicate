name: opt-in live SPHEREx validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python scripts/validate_live.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-archive-evidence
          path: docs/LIVE_VALIDATION.json
