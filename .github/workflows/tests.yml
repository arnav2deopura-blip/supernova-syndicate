name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/*requirements*'
      - run: pip install -r backend/requirements.txt
      - run: pip check && pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test frontend/tests/*.test.mjs
      - run: node scripts/check_changes.mjs --inject
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tests/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 5601 --bind 127.0.0.1 --directory frontend &
          trap 'kill $!' EXIT
          python tests/browser/regression.py
