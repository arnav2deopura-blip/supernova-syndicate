name: check SPHEREx releases

# Weekly: list the public SPHEREx S3 mirror and open an issue when a new release or new weeks appear.
on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - id: check
        run: python scripts/check_releases.py --issue
        env:
          SPHEREX_CACHE_DIR: ${{ runner.temp }}/spherex-cache
      - if: steps.check.outputs.new_data == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="New SPHEREx data on the archive"
          if gh issue list --state open --search "in:title \"$title\"" --json number --jq 'length' | grep -qv '^0$'; then
            echo "An open issue already tracks this."
          else
            gh issue create --title "$title" --body-file issue.md --label data || gh issue create --title "$title" --body-file issue.md
          fi
